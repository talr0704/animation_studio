<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פופה — פינת הציפורניים</title><link rel="stylesheet" href="game/manicure/manicure.css?v=buttons-2"></head><body>
<header><a href="game.html">← הביתה</a><h1>פינת הציפורניים של פופה ✿</h1><button id="sound" aria-pressed="false">צליל כבוי ♫</button><span id="save-status" role="status">טוענים…</span></header>
<main id="scene"><img class="room-background" src="assets/scenes/home/room.svg" alt=""><div class="care-note"><strong id="phase-title">בוחרים ציפורן</strong><progress id="progress" value="0" max="100" aria-label="התקדמות הטיפול"></progress><p id="hint" role="status">לחצי על אחת מארבע הציפורניים של פופה.</p></div>
<section id="bottles" aria-label="בקבוקי לק לבחירה"></section><div class="brush-width-buttons" aria-label="עובי המכחול"><button data-width="14">דק</button><button data-width="35" aria-pressed="true">רגיל</button><button data-width="65">עבה</button></div>
<section class="work-area"><div id="overview"><img class="paw-cushion" src="assets/scenes/manicure/furniture/paw-cushion.png" alt="כרית לכפה"><div id="paw-frame"><canvas id="paw" width="546" height="760" aria-label="הכפה של פופה עם ארבע ציפורניים"></canvas><div id="nail-targets"></div></div><img class="paw-towel" src="assets/scenes/manicure/props/care/images/towel.png" alt=""><p class="paw-note">בחרי ציפורן לטיפול מקרוב</p></div>
<div id="detail" hidden><div id="nail-strip" aria-label="בחירת ציפורן"></div><button id="back-paw">↩ כל הכפה</button><div class="nail-desk"><canvas id="work" width="256" height="384" aria-label="ציפורן לטיפול וציור חופשי"></canvas></div><input id="brush-size" type="hidden" value="35"><input id="view-rotation" type="hidden" value="0"><input id="view-zoom" type="hidden" value="1"></div>
</section>
<section class="finishing"><button id="dryer" aria-label="לייבש את הלק"><img src="assets/scenes/manicure/furniture/dryer-open.png" alt="מנורת ייבוש"><span>ייבוש וברק</span></button><input id="creative" type="checkbox" hidden><button class="creative" id="creative-toggle" aria-pressed="false">צביעה חלקית</button><div id="stickers" aria-label="מדבקות"></div><div id="sticker-controls" hidden><input id="sticker-size" type="hidden" value="60"><input id="sticker-rotation" type="hidden" value="0"><div class="sticker-step-buttons"><button data-adjust="sticker-size" data-delta="-10" aria-label="הקטנת המדבקה">−</button><span>גודל</span><button data-adjust="sticker-size" data-delta="10" aria-label="הגדלת המדבקה">+</button><button data-adjust="sticker-rotation" data-delta="-15" aria-label="סיבוב שמאלה">↶</button><span>סיבוב</span><button data-adjust="sticker-rotation" data-delta="15" aria-label="סיבוב ימינה">↷</button></div><button id="remove-sticker">הסרת המדבקה</button></div></section>
<section class="care-tools" aria-label="כלי הטיפול"><img class="tray-art" src="assets/scenes/manicure/furniture/tool-tray.png" alt=""><button data-tool="remove" aria-label="צמר גפן להסרת לק"><img src="assets/scenes/manicure/props/care/images/cotton-clean.png" alt=""><span>הסרת לק</span></button><button id="soap" aria-label="סבון לניקוי"><span>סבון</span></button><button data-tool="clean" aria-label="מברשת ניקוי"><img src="assets/scenes/manicure/props/care/images/cleaning-brush.png" alt=""><span>ניקוי</span></button><button data-tool="file" aria-label="פצירה לתיקון הקצה"><img src="assets/scenes/manicure/props/care/images/nail-file.png" alt=""><span>שיוף</span></button></section>
<div class="session-actions"><button id="undo" aria-label="ביטול משיכה">↶ ביטול</button><button id="redo" aria-label="ביצוע מחדש">↷ שוב</button><button id="clear-paint">ניקוי הצבע</button><button id="photo">📷 תמונה</button><button id="finish">סיימנו ✨</button><button id="new-session">טיפול חדש</button></div>
<p id="completion">0 מתוך 4 ציפורניים יבשות</p><img id="companion" src="assets/scenes/salon/character/head.png" alt="פופה מחייכת">
<div id="drying" class="modal" hidden><div class="drying-card"><h2>רגע של ברק…</h2><div class="dryer-rig"><img class="dryer-back" src="assets/scenes/manicure/furniture/dryer-open.png" alt=""><div class="dryer-opening"><canvas class="dryer-paw" width="546" height="1360"></canvas></div><img class="dryer-light" src="assets/scenes/manicure/furniture/dryer-light.png" alt=""><img class="dryer-front" src="assets/scenes/manicure/furniture/dryer-front.png" alt=""></div><progress id="dry-progress" max="100" value="0" aria-label="התקדמות הייבוש"></progress></div></div>
<div id="result" class="modal" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden><div class="result-card"><h2 id="result-title">הציפורניים של פופה, בעיצוב שלך!</h2><img id="result-image" alt="תוצאת הטיפול"><p id="reward"></p><button id="result-photo">שמירת תמונה</button><button id="result-close">חוזרות לכפה</button><button id="result-new">טיפול חדש</button></div></div>
<div id="loading" role="status">מסדרים את פינת הטיפוח…</div></main><img id="held-tool" alt="" hidden><script type="module" src="game/manicure/app.js?v=buttons-2"></script></body></html>
