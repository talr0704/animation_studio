<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popa — Animated Cat</title>
    <link rel="stylesheet" href="style.css?v=organized-assets-19" />
    <link rel="stylesheet" href="popa-outfits.css?v=2" />
  </head>
  <body class="studio-play">
    <script>if(new URLSearchParams(location.search).get("outfits")==="1"){document.body.classList.add("outfit-studio");document.body.classList.remove("studio-play");}if(new URLSearchParams(location.search).get("edit")==="1")document.body.classList.remove("studio-play");</script>
    <a class="outfit-studio-link" href="index.html?outfits=1">הלוקים של פופה</a>
    <a class="edit-studio-link" href="studio.html">עורך אביזרים</a>
    <a href="game.html" style="position:fixed;top:12px;left:12px;z-index:1200;background:#627d58;color:white;padding:12px 18px;border-radius:12px;text-decoration:none;font:600 14px system-ui">✿ לעולם של פופה</a>
    <main class="stage" aria-label="Animated cat character demo">
      <div class="robot-ground-shadow" aria-hidden="true"></div>
      <div class="cat-frame">
        <div class="cat-wrapper" data-part="robotWrapper">
          <section class="cat-character" data-part="robot" aria-label="Popa the cat, assembled from individual illustrated parts"></section>
        </div>
      </div>
      <p class="character-status" role="status" hidden></p>

      <details class="studio-controls"><summary>תנועות של פופה ♫</summary><div class="controls" aria-label="Animation controls">
        <button type="button" data-action="idle">idle</button>
        <button type="button" data-action="walk">walk</button>
        <button type="button" data-action="happy">happy</button>
        <button type="button" data-action="wave">wave</button>
        <button type="button" data-action="curious">curious</button>
        <button type="button" data-action="interact">interact</button>
        <button type="button" data-action="hold">hold</button>
        <button type="button" data-action="pet">pet</button>
        <button type="button" data-action="rest">rest</button>
        <button type="button" data-action="stop">stop</button>
      </div></details>
      <a class="character-download" href="downloads/popa-browser.zip" download>הורדת פופה לשילוב במשחק דפדפן (ZIP)</a>
    </main>

    <script>document.querySelector(".cat-frame").addEventListener("click",()=>{if(document.body.classList.contains("studio-play"))document.querySelector('[data-action="happy"]').click();});</script>
    <script src="vendor/gsap.min.js"></script>
    <script type="module" src="cat-character.js?v=sleeve-layers-8"></script>
  </body>
</html>
