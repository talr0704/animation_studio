<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popa — Animated Cat</title>
    <link rel="stylesheet" href="style.css?v=popa-editor-2" />
  </head>
  <body>
    <main class="stage" aria-label="Animated cat character demo">
      <div class="robot-ground-shadow" aria-hidden="true"></div>
      <div class="cat-frame">
        <div class="cat-wrapper" data-part="robotWrapper">
          <section class="cat-character" data-part="robot" aria-label="Popa the cat, assembled from individual illustrated parts"></section>
        </div>
      </div>
      <p class="character-status" role="status" hidden></p>

      <div class="controls" aria-label="Animation controls">
        <button type="button" data-action="idle">Idle</button>
        <button type="button" data-action="inspired">Inspired</button>
        <button type="button" data-action="wave">Wave</button>
        <button type="button" data-action="floatWaveAndSway">Wave & Sway</button>
        <button type="button" data-action="lookAround">Look Around</button>
        <button type="button" data-action="nod">Nod</button>
        <button type="button" data-action="bounce">Bounce</button>
        <button type="button" data-action="ponder">Ponder</button>
        <button type="button" data-action="dance">Dance</button>
        <button type="button" data-action="roamAndDisappear">Roam &amp; Disappear</button>
        <button type="button" data-action="talk">Talk</button>
        <button type="button" data-action="stop">Stop</button>
      </div>
    </main>

    <script src="vendor/gsap.min.js"></script>
    <script type="module" src="cat-character.js?v=popa-editor-2"></script>
  </body>
</html>
