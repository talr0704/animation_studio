<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popa — Animated Cat</title>
    <link rel="stylesheet" href="style.css?v=popa-game-clips-16" />
  </head>
  <body>
    <main class="stage" aria-label="Animated cat character demo">
      <div class="robot-ground-shadow" aria-hidden="true"></div>
      <div class="cat-frame">
        <div class="cat-wrapper" data-part="robotWrapper">
          <section class="cat-character" data-part="robot" aria-label="Popa the cat, assembled from individual illustrated parts"></section>
        </div>
      </div>
      <p class="character-status" role="status" hidden></p>

      <div class="controls" aria-label="Animation controls">
        <button type="button" data-action="idle">idle</button>
        <button type="button" data-action="walk">walk</button>
        <button type="button" data-action="happy">happy</button>
        <button type="button" data-action="wave">wave</button>
        <button type="button" data-action="curious">curious</button>
        <button type="button" data-action="interact">interact</button>
        <button type="button" data-action="hold">hold</button>
        <button type="button" data-action="pet">pet</button>
        <button type="button" data-action="rest">rest</button>
        <button type="button" data-action="stop">stop</button>
      </div>
    </main>

    <script src="vendor/gsap.min.js"></script>
    <script type="module" src="cat-character.js?v=popa-game-clips-16"></script>
  </body>
</html>
